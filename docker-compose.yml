services:
  web:
    build: .
    container_name: c3-edu
    working_dir: /app
    environment: 
      - SQLALCHEMY_DATABASE_URI=sqlite:////data/app.db 
      # Remove below for prod
      - FLASK_ENV=development
      - FLASK_APP=app
    volumes:
      # Remove prod
    #  - .:/app
      - ./data:/data 
    ports:
      - "5000:5000"
    #restart: unless-stopped
    #
volumes:
  - data
  - app
